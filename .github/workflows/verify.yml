name: Verify scheduling evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - run: python planner.py examples/burst.csv | diff -u examples/results.json -
      - run: python sweep.py | diff -u examples/oracle-sweep.json -
